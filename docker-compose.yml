#version: '3.8'
services:
  # 1. Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: /bin/sh
    command: "-c 'ollama serve; sleep 3; ollama pull mistral'"
    restart: unless-stopped

